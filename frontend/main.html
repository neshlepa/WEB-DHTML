<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food-Tinder | Главная</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="main-body">
    <div id="header-root" style="width: 100%; display: flex; justify-content: center;"></div>
    <main class="main-content">
        <aside class="left-panel">
            <h2 class="hero-title">Найди блюдо <br><span class="highlight">по душе</span></h2>
            <p class="hero-subtitle">Свайпни вправо, чтобы добавить в план, сохрани на потом или пропусти, чтобы увидеть следующее.</p>
            <div class="instructions">
                <div class="instruction-item"><span class="arrow green">→</span> <div><b>Нравится</b><br><small>ДОБАВИТЬ В ПЛАН</small></div></div>
                <div class="instruction-item"><span class="arrow yellow">↑</span> <div><b>Сохранить</b><br><small>ОТЛОЖИТЬ НА ПОТОМ</small></div></div>
                <div class="instruction-item"><span class="arrow red">←</span> <div><b>Пропустить</b><br><small>СЛЕДУЮЩЕЕ БЛЮДО</small></div></div>
            </div>
            <div class="stats-box">
                <div class="stat"><span class="stat-num" id="likedCount">0</span><br><small>НРАВИТСЯ</small></div>
                <div class="stat"><span class="stat-num" id="savedCount">0</span><br><small>СОХРАНЕНО</small></div>
                <div class="stat"><span class="stat-num" id="leftCount">10</span><br><small>ОСТАЛОСЬ</small></div>
            </div>
        </aside>
        <section class="center-panel">
            <div class="card-wrapper" id="cardWrapper"><div class="loading">Загрузка рецептов...</div></div>
        </section>
        <aside class="right-panel">
            <div class="info-section" id="upNowSection" style="display: none;">
                <p class="section-label">СЕЙЧАС В ЛЕНТЕ</p>
                <div class="info-card">
                    <h3 id="upNowTitle"></h3>
                    <ul class="ingredients-list" id="upNowIngredients"></ul>
                </div>
            </div>
            <div class="info-section" id="likedSection" style="display: none;">
                <p class="section-label">ПОНРАВИВШИЕСЯ БЛЮДА</p>
                <div id="likedList"></div>
            </div>
        </aside>
    </main>
    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/feed.js"></script>
</body>
</html>
