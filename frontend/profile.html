<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Food-Tinder | Профиль</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="profile-body">
    <header class="profile-header">
        <h1 class="logo">Food-Tinder</h1>
        <div class="header-actions">
            <a href="main.html" class="nav-btn">На главную</a>
            <button id="logoutBtn" class="nav-btn">Выйти</button>
        </div>
    </header>
    
    <main class="profile-container">
        <h2>Личная информация</h2>
        <div id="statusMessage" class="error-message" style="display: none;"></div>

        <form id="profileForm">
            <div class="form-group">
                <label>Email (нельзя изменить)</label>
                <input type="email" id="email" disabled class="disabled-input">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Пол</label>
                    <select id="gender">
                        <option value="male">Мужской</option>
                        <option value="female">Женский</option>
                        <option value="other">Другой</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Возраст</label>
                    <input type="number" id="age" min="1" max="120">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Рост (см)</label>
                    <input type="number" id="height" min="50" max="250">
                </div>
                <div class="form-group">
                    <label>Вес (кг)</label>
                    <input type="number" step="0.1" id="weight" min="20" max="300">
                </div>
            </div>

            <h3>Аллергены</h3>
            <div class="checkbox-grid" id="allergens-container">
                <!-- Чекбоксы добавим через JS -->
            </div>

            <h3>Предпочтения в еде</h3>
            <div class="checkbox-grid" id="preferences-container">
                <!-- Чекбоксы добавим через JS -->
            </div>

            <button type="submit" class="btn-primary" id="saveBtn">Сохранить изменения</button>
        </form>
    </main>

    <script src="js/profile.js"></script>
</body>
</html>
