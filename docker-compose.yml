services:
  postgres:
    image: postgres:16-alpine
    container_name: food_tinder_postgres
    restart: always
    environment:
      POSTGRES_DB: planfood_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ft_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: food_tinder_backend
    restart: always
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/planfood_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx512m
    depends_on:
      - postgres
    networks:
      - ft_network

  nginx:
    image: nginx:alpine
    container_name: food_tinder_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - ft_network

volumes:
  postgres_data:

networks:
  ft_network:
    driver: bridge